name: PostureFix
options:
  bundleIdPrefix: com.posturefix
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  PostureFix:
    type: application
    platform: macOS
    sources:
      - path: Sources/PostureFix
        excludes:
          - Resources/Info.plist
          - Resources/PostureFix.entitlements
    info:
      path: Sources/PostureFix/Resources/Info.plist
      properties:
        LSUIElement: true
        NSCameraUsageDescription: "PostureFix uses your camera to detect your posture in real time and alert you when you slouch. No video is recorded or sent anywhere."
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    entitlements:
      path: Sources/PostureFix/Resources/PostureFix.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.posturefix.app
        PRODUCT_NAME: PostureFix
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
      gatherCoverageData: false
